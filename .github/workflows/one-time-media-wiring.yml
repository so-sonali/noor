name: One-time NOOR media wiring

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  wire-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire media runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/app.js')
          text=p.read_text()
          marker="import './media.js';\n"
          if marker not in text:
              p.write_text(marker+text)
          PY

      - name: Verify JavaScript
        run: |
          node --check js/app.js
          node --check js/media.js
          node --check js/storage.js
          node --check js/tools.js
          node --test tests/calculators.test.mjs

      - name: Remove one-time workflow and commit wiring
        run: |
          rm -f .github/workflows/one-time-media-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/one-time-media-wiring.yml
          if ! git diff --cached --quiet; then
            git commit -m "Enable camera results and storage-aware media"
            git push origin main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
