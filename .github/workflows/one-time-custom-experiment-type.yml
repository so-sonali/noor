name: One-time custom experiment type

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Other experiment type and custom field
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old = '<label>Experiment type<select id="expType"></select></label></div><label>Objective / hypothesis'
          new = '<label>Experiment type<select id="expType"></select></label></div><label id="expCustomTypeWrap" style="display:none">Custom experiment type<input id="expCustomType" placeholder="e.g. Photocurrent stability test"></label><label>Objective / hypothesis'
          if old not in text:
              raise SystemExit('Experiment type markup target not found')
          index.write_text(text.replace(old, new, 1))

          app = Path('js/app.js')
          text = app.read_text()
          old = "function fillTypes(selected){const label=$('#expDiscipline').value;$('#expType').innerHTML=typesFor(label).map(t=>`<option ${t===selected?'selected':''}>${esc(t)}</option>`).join('');}"
          new = "function syncCustomExperimentType(){const custom=$('#expType').value==='__other__';$('#expCustomTypeWrap').style.display=custom?'':'none';$('#expCustomType').required=custom;if(!custom)$('#expCustomType').value='';}\nfunction fillTypes(selected){const label=$('#expDiscipline').value,presets=typesFor(label),isCustom=Boolean(selected)&&!presets.includes(selected);$('#expType').innerHTML=presets.map(t=>`<option ${t===selected?'selected':''}>${esc(t)}</option>`).join('')+`<option value=\"__other__\" ${isCustom?'selected':''}>Other</option>`;$('#expCustomType').value=isCustom?selected:'';syncCustomExperimentType();}"
          if old not in text:
              raise SystemExit('fillTypes target not found')
          text = text.replace(old, new, 1)

          old = "async function saveExperiment(ev){ev.preventDefault();const id=$('#expId').value||uid('exp');const existing=await get('experiments',id);const now=new Date().toISOString();await put('experiments',{id,title:$('#expTitle').value.trim(),project:$('#expProject').value.trim(),discipline:$('#expDiscipline').value,type:$('#expType').value,objective:$('#expObjective').value.trim(),materials:$('#expMaterials').value.trim(),procedure:$('#expProcedure').value.trim(),observation:$('#expObservation').value.trim(),interpretation:$('#expInterpretation').value.trim(),nextStep:$('#expNext').value.trim(),createdAt:existing?.createdAt||now,updatedAt:now});$('#experimentDialog').close();await refresh();showView('experiments');toast('Experiment saved locally');}"
          new = "async function saveExperiment(ev){ev.preventDefault();const id=$('#expId').value||uid('exp');const existing=await get('experiments',id);const now=new Date().toISOString();const selectedType=$('#expType').value;const experimentType=selectedType==='__other__'?$('#expCustomType').value.trim():selectedType;if(!experimentType){toast('Enter a custom experiment type');return;}await put('experiments',{id,title:$('#expTitle').value.trim(),project:$('#expProject').value.trim(),discipline:$('#expDiscipline').value,type:experimentType,objective:$('#expObjective').value.trim(),materials:$('#expMaterials').value.trim(),procedure:$('#expProcedure').value.trim(),observation:$('#expObservation').value.trim(),interpretation:$('#expInterpretation').value.trim(),nextStep:$('#expNext').value.trim(),createdAt:existing?.createdAt||now,updatedAt:now});$('#experimentDialog').close();await refresh();showView('experiments');toast('Experiment saved locally');}"
          if old not in text:
              raise SystemExit('saveExperiment target not found')
          text = text.replace(old, new, 1)

          old = "$('#expDiscipline').onchange=()=>fillTypes();$('#experimentFilter').oninput=renderExperiments;"
          new = "$('#expDiscipline').onchange=()=>fillTypes();$('#expType').onchange=syncCustomExperimentType;$('#experimentFilter').oninput=renderExperiments;"
          if old not in text:
              raise SystemExit('experiment change binding target not found')
          app.write_text(text.replace(old, new, 1))

          sw = Path('sw.js')
          text = sw.read_text()
          if "const CACHE='noor-v1.3.0-handwriting';" not in text:
              raise SystemExit('service worker cache target not found')
          sw.write_text(text.replace("const CACHE='noor-v1.3.0-handwriting';", "const CACHE='noor-v1.3.1-custom-type';", 1))
          PY

      - name: Verify
        run: |
          node --check js/app.js
          node tests/tool-tests.mjs
          grep -q 'id="expCustomType"' index.html
          grep -q 'value="__other__"' js/app.js

      - name: Commit source update and remove one-time workflow
        run: |
          git config user.name "Sonali Garg"
          git config user.email "145942258+so-sonali@users.noreply.github.com"
          git rm .github/workflows/one-time-custom-experiment-type.yml
          git add index.html js/app.js sw.js
          git commit -m "Allow custom experiment types"
          git push
